<!DOCTYPE html>
<html lang="en">
<head>
    <title>Report Output</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h2>Generated Report</h2>
<table id="reportTable">
    <thead>
        <tr>
            <th>A (Y-axis)</th>
            <th>B (X-axis)</th>
            <th>C (Plot Value)</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let tableBody = document.querySelector("#reportTable tbody");

for (let a = 1; a <= 10; a++) {
    for (let b = 1; b <= 10; b++) {
        let c = Math.sqrt((a * a) + (b * b));  // Calculate the plot value

        let row = document.createElement("tr");
        row.innerHTML = `<td>${a}</td><td>${b}</td><td>${c.toFixed(2)}</td>`;
        tableBody.appendChild(row);
    }
}
</script>

</body>
</html>
